server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 容器健康检查端点（仅静态响应，不涉及任何业务逻辑）
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源缓存
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }
}
