# 宿主机端口可通过环境变量 WEB_PORT 配置（默认 8080）
#
# 服务：
#   web     纯前端静态站点（nginx 托管 dist，含 /healthz 健康检查），无任何业务后端
#   verify  一次性验收服务：类型检查 + 性质测试 + 对 web 探活；完成后以退出码报告结果并自行退出
#
# 用法：
#   WEB_PORT=9090 docker compose up --build          # 启动静态站点
#   docker compose run --rm verify                   # 跑一次性验收（退出码即结论）
#   docker compose up --build verify                 # 同上，适合 CI/流水线

services:
  web:
    build:
      context: .
      target: web
    image: crc-inversion-bench-web:latest
    ports:
      - "${WEB_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/healthz | grep -q ok || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 3s
    restart: unless-stopped

  verify:
    build:
      context: .
      target: builder
    image: crc-inversion-bench-builder:latest
    environment:
      # 直接探活 web 静态服务；不本地重建
      WEB_BASE_URL: http://web:8080
    depends_on:
      web:
        condition: service_healthy
    restart: "no"
    # 一次性：脚本 process.exit(报告码) 后容器自行退出，不常驻
